{% extends "base.html" %}
{% block title %}Log in · UkayTaNa{% endblock %}
{% block content %}
<section class="form-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in to UkayTaNa</h1>
    <p class="muted">Pick up where your next great find begins.</p>
    <form method="post" class="account-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button button-primary button-wide" type="submit">Log in</button>
    </form>
    <p class="form-switch">New to UkayTaNa? <a href="{% url 'signup' %}">Create an account</a></p>
</section>
{% endblock %}
